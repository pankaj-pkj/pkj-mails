<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Terminal: npm install, then npm start prints the local link and the setup code">
<rect width="900" height="290" rx="16" fill="#0d0b19"/>
<rect width="900" height="40" rx="16" fill="#1a1730"/><rect y="24" width="900" height="16" fill="#1a1730"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
<text x="450" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8f89c4">pkj-mails — terminal</text>
<clipPath id="t0"><rect x="40" y="64" width="0" height="26"><animate attributeName="width" values="0;0;129;129" keyTimes="0;0.040;0.200;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  <text x="40" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#ffffff" clip-path="url(#t0)"><tspan fill="#9d7bff">$ </tspan>npm install</text><text x="40" y="112" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#7f7aa8" opacity="0">added 146 packages in 4s
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.220;0.225;1" dur="10s" repeatCount="indefinite"/></text><clipPath id="t2"><rect x="40" y="124" width="0" height="26"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.300;0.400;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  <text x="40" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#ffffff" clip-path="url(#t2)"><tspan fill="#9d7bff">$ </tspan>npm start</text><text x="40" y="172" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#5dff9a" opacity="0">PKJ Mails is running
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.440;0.445;1" dur="10s" repeatCount="indefinite"/></text><text x="40" y="202" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#e8e4ff" opacity="0">Open:       http://localhost:3000
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.470;0.475;1" dur="10s" repeatCount="indefinite"/></text><text x="40" y="232" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#ffb3d6" opacity="0">Setup code: 3f9a1c2b   (the setup page asks for it)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.505;1" dur="10s" repeatCount="indefinite"/></text>
<rect x="40" y="252" width="10" height="18" fill="#9d7bff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
