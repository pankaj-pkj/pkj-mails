<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="PKJ Mails — your own webmail with your own domain">
<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#e0408f"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14112b"/><stop offset="1" stop-color="#1d0f24"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#6d5dfc" stop-opacity=".55"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#e0408f" stop-opacity=".45"/><stop offset="1" stop-color="#e0408f" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="1200" height="300" rx="24"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="40" r="260" fill="url(#g1)"><animate attributeName="cx" values="200;300;200" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="280" r="260" fill="url(#g2)"><animate attributeName="cy" values="280;220;280" dur="10s" repeatCount="indefinite"/></circle>
  <g transform="translate(64 64) scale(1.25)"><g>
  <rect width="64" height="64" rx="18" fill="url(#lg)"/>
  <path d="M13 22c0-2.2 1.8-4 4-4h30c2.2 0 4 1.8 4 4v20c0 2.2-1.8 4-4 4H17c-2.2 0-4-1.8-4-4z" fill="#fff"/>
  <path d="M15 21 32 34l17-13" fill="none" stroke="#6d5dfc" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</g></g>
  <text x="172" y="112" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#fff" letter-spacing="-1.5">PKJ Mails</text>
  <text x="66" y="186" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="27" fill="#e8e4ff">Your own webmail — with <tspan fill="#ffb3d6" font-weight="600">you@yourdomain.com</tspan></text>
  <text x="66" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#a9a3d9">free · open source · runs on your PC or a free server</text>
  <!-- inbox window -->
  <g transform="translate(860 52)">
    <rect width="290" height="196" rx="16" fill="#fff"/>
    <rect width="290" height="34" rx="16" fill="#f1efff"/><rect y="18" width="290" height="16" fill="#f1efff"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="36" cy="17" r="5" fill="#febc2e"/><circle cx="52" cy="17" r="5" fill="#28c840"/>
    <text x="80" y="22" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b5675" font-weight="600">Inbox</text>
    <g font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11">
      <g><rect x="14" y="48" width="262" height="30" rx="8" fill="#f7f5ff"/><circle cx="32" cy="63" r="9" fill="#6d5dfc"/><text x="48" y="60" font-weight="700" fill="#1d1b2c">New client</text><text x="48" y="73" fill="#77728f">Contract for the landing page</text>
        <animate attributeName="opacity" values=".35;1;1;.35" dur="5.5s" repeatCount="indefinite"/></g>
      <g><rect x="14" y="86" width="262" height="30" rx="8" fill="#fbfaff"/><circle cx="32" cy="101" r="9" fill="#e0408f"/><text x="48" y="98" font-weight="700" fill="#1d1b2c">Riya</text><text x="48" y="111" fill="#77728f">Photos from the event</text></g>
      <g><rect x="14" y="124" width="262" height="30" rx="8" fill="#fbfaff"/><circle cx="32" cy="139" r="9" fill="#22b07d"/><text x="48" y="136" fill="#1d1b2c">Registrar</text><text x="48" y="149" fill="#77728f">yourdomain.com renewed</text></g>
      <g><rect x="14" y="162" width="262" height="24" rx="8" fill="#fbfaff"/><circle cx="32" cy="174" r="8" fill="#f5a524"/><text x="48" y="178" fill="#77728f">Weekly digest</text></g>
    </g>
    <circle cx="282" cy="8" r="11" fill="#e0408f"><animate attributeName="r" values="9;13;9" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="282" y="12" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
  </g>
  <g opacity="0">
    <rect x="-10" y="-8" width="34" height="24" rx="4" fill="#fff" stroke="#6d5dfc" stroke-opacity=".35"/>
    <path d="M-8 -6 7 6 22 -6" fill="none" stroke="#6d5dfc" stroke-width="2" stroke-linejoin="round"/>
    <animateMotion dur="5.5s" begin="0s" repeatCount="indefinite" path="M560,70 C700,30 780,100 905,135"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="5.5s" begin="0s" repeatCount="indefinite"/>
  </g><g opacity="0">
    <rect x="-10" y="-8" width="34" height="24" rx="4" fill="#fff" stroke="#6d5dfc" stroke-opacity=".35"/>
    <path d="M-8 -6 7 6 22 -6" fill="none" stroke="#6d5dfc" stroke-width="2" stroke-linejoin="round"/>
    <animateMotion dur="6.5s" begin="1.8s" repeatCount="indefinite" path="M560,130 C700,90 780,160 905,135"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="6.5s" begin="1.8s" repeatCount="indefinite"/>
  </g><g opacity="0">
    <rect x="-10" y="-8" width="34" height="24" rx="4" fill="#fff" stroke="#6d5dfc" stroke-opacity=".35"/>
    <path d="M-8 -6 7 6 22 -6" fill="none" stroke="#6d5dfc" stroke-width="2" stroke-linejoin="round"/>
    <animateMotion dur="6s" begin="3.4s" repeatCount="indefinite" path="M560,190 C700,150 780,220 905,135"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="6s" begin="3.4s" repeatCount="indefinite"/>
  </g><g opacity="0">
    <rect x="-10" y="-8" width="34" height="24" rx="4" fill="#fff" stroke="#6d5dfc" stroke-opacity=".35"/>
    <path d="M-8 -6 7 6 22 -6" fill="none" stroke="#6d5dfc" stroke-width="2" stroke-linejoin="round"/>
    <animateMotion dur="7s" begin="4.6s" repeatCount="indefinite" path="M560,100 C700,60 780,130 905,135"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="7s" begin="4.6s" repeatCount="indefinite"/>
  </g>
</g>
</svg>
